<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Finance Manager - Home</title>
    <!-- Linking independent CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" id="theme-stylesheet">
</head>
<body id="main-body-container">

    <!-- Top Header Section with India Logo and Tagline -->
    <header id="top-header-section" class="header-light">
        <div id="logo-container" class="logo-box">
            <span id="india-flag-icon">🇮🇳</span>
            <h1 id="app-title-text">INDIAN FINANCE MANAGER</h1>
        </div>
        <p id="app-tagline-text">Only For Indian People</p>
        
        <!-- Theme Toggle Button -->
        <button id="theme-toggle-btn" onclick="toggleThemeMode()">Switch Dark/Light Mode</button>

        <!-- Navigation Links to Login and Register Pages -->
        <div id="nav-links-box" style="margin-top: 15px;">
            <a href="/login" style="margin-right: 15px; color: #0066cc; text-decoration: none; font-weight: 600; font-size: 14px;">Login</a>
            <a href="/register" style="color: #0066cc; text-decoration: none; font-weight: 600; font-size: 14px;">Register</a>
        </div>
    </header>

    <!-- Hero Section -->
    <main id="main-hero-section" class="hero-light">
        <div id="welcome-card-box" class="card-box">
            <h2 id="welcome-heading">Take Control of Your Wealth</h2>
            <p id="welcome-description">Manage Your Income, Track Automated Tax Calculations, And Secure Your Financial Future.</p>
        </div>
    </main>

    <!-- Linking independent JS file -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
