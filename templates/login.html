<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Finance Manager - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}" id="login-theme-style">
</head>
<body id="login-body-container">

<!-- Login Container Box -->
<div id="login-card-box" class="login-card">
   <h2 id="login-form-title">Welcome Back</h2>
   <p id="login-form-subtitle">Login To Your Indian Finance Manager</p>
   
<!-- Login Form -->
<form id="user-login-form">

<!-- Email Address -->
<div id="input-group-email" class="input-field-box">
   <label for="login-email">Email Address</label>
   <input type="email" id="login-email" placeholder="Enter Your Email" autocomplete="email" required>
</div> 

<!-- Password -->
<div id="input-group-password" class="input-field-box">
   <label for="login-password">Password</label>
   <input type="password" id="login-password" placeholder="Enter Your Password" autocomplete="current-password" required>
</div>

<!-- Submit Button (Capsule Shape) -->
<button type="submit" id="login-submit-btn">Login Account</button>

</form>

<!-- Link To Register Page If User Doesn't Have An Account -->
<div id="register-redirect-box" class="redirect-text-box">
  <p>Don't have An Account ? <a href="/register" id="to-register-link">Register Here</a></p>
</div>

</div> 

<!-- Linking Independent Js Files For Login -->
<script src="{{ url_for('static', filename='login.js') }}"></script>
    
</body>
</html>
